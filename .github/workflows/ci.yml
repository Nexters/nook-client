name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# PR 브랜치에 연달아 푸시하면 낡은 커밋의 실행은 취소한다.
# main·develop 의 push 실행은 머지 결과물에 대한 최종 검증이므로 취소하지 않는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI contracts
        run: pnpm api:check:remote

      - name: Lint (biome)
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm web:build
        env:
          VITE_API_BASE_URL: http://localhost:8080
# NOTE: 네이티브(android/ios) 빌드는 무겁고 시크릿(서명)이 필요하므로 이 CI 범위에서 제외한다. 스토어 배포 파이프라인은 후속 계획에서 다룬다.
